<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DayBuddy</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>DayBuddy</h1></header>

<main style="max-width:1000px;margin:auto;padding:16px">

  <!-- AUTH -->
  <section id="auth" class="card">
    <h2>Login / Register</h2>
    <label>Username</label>
    <input id="authUser">
    <label>Password</label>
    <input id="authPass" type="password">
    <label>Confirm Password (only for register)</label>
    <input id="authPass2" type="password">
    <button onclick="doRegister()">Register</button>
    <button onclick="doLogin()">Login</button>
  </section>

  <!-- APP -->
  <section id="app" style="display:none">
    <div class="card">
      <div id="welcome"></div>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>Task Manager</h2>
      <input id="inTitle" placeholder="Title">
      <textarea id="inDetail" placeholder="Detail"></textarea>
      <select id="inPriority">
        <option>High</option><option>Medium</option><option selected>Low</option>
      </select>
      <input id="inDue" type="date">
      <button onclick="addTask()">Add Task</button>
      <button onclick="undoTask()">Undo</button>
      <button onclick="redoTask()">Redo</button>
      <input id="inSearch" placeholder="Search...">
      <table>
        <thead><tr><th>#</th><th>Title</th><th>Detail</th><th>Priority</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <button onclick="deleteAllTasks()">Delete All Tasks</button>
    </div>

    <div class="card" id="calendar">
      <h2>Calendar</h2>
      <div id="monthTitle"></div>
      <div style="margin:10px 0">
        <button onclick="prevMonth()">Prev</button>
        <button onclick="nextMonth()">Next</button>
        <button onclick="renderTasks()">Show All Tasks</button>
      </div>
      <div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div>
    </div>

    <div class="card">
      <h2>Expense Tracker</h2>
      <input id="exDate" type="date">
      <select id="exType"><option value="income">Income</option><option value="expense">Expense</option></select>
      <input id="exTitle" placeholder="Title">
      <input id="exAmount" type="number" step="0.01">
      <button onclick="addExpense()">Add</button>
      <input id="exSearch" placeholder="Search...">
      <table>
        <thead><tr><th>#</th><th>Date</th><th>Type</th><th>Title</th><th>Amount</th><th>Actions</th></tr></thead>
        <tbody id="exTbody"></tbody>
      </table>
      <button onclick="deleteAllExpenses()">Delete All Expenses</button>
      <div id="exSummary" style="margin-top:10px;font-weight:bold"></div>
    </div>

    <div class="card">
      <h2>Reminder Alarm</h2>
      <input id="remValue" type="number" placeholder="Enter value">
      <select id="remUnit">
        <option value="sec">Seconds</option>
        <option value="min">Minutes</option>
        <option value="hour">Hours</option>
      </select>
      <button onclick="setReminder()">Set Reminder</button>
      <span id="ringBadge" style="display:none;color:var(--danger);font-weight:bold">Ringing!</span>
      <div>
        <button onclick="stopReminder()">Stop</button>
        <button onclick="snoozeReminder()">Snooze 5 min</button>
      </div>
      <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>
    </div>
  </section>

  <!-- ADMIN -->
  <section id="admin" class="card" style="display:none">
    <h2>Admin Dashboard</h2>
    <div style="margin-bottom:8px">
      <button onclick="adminUndo()">Admin Undo</button>
      <button onclick="adminRedo()">Admin Redo</button>
    </div>
    <table>
      <thead><tr><th>Username</th><th>Actions</th></tr></thead>
      <tbody id="adminUsers"></tbody>
    </table>
    <div id="adminViewBox" style="margin-top:20px"></div>
    <button onclick="logout()">Logout</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
